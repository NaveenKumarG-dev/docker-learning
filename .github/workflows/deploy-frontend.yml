name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend using Docker
        run: |
          # Build the image using the existing frontend Dockerfile
          docker build -t frontend-app ./frontend
          
          # Run the build command inside a container to generate static assets
          docker run --name frontend-container frontend-app npm run build
          
          # Extract the built static assets from the container to the runner
          docker cp frontend-container:/app/dist ./_site
          
          # Clean up the container
          docker rm frontend-container

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
